name: Update README

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update-readme:
    name: Refresh dynamic README sections
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run typecheck
        run: bun typecheck

      - name: Run tests
        run: bun test

      - name: Update README
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_PROJECT_MAPPING: ${{ secrets.CURRENT_PROJECT_MAPPING }}
          LOCAL_REPOS_PATHS: ${{ secrets.LOCAL_REPOS_PATHS }}
        run: bun start

      - name: Commit and push if changed
        run: |
          if git diff --quiet README.md; then
            echo "README.md unchanged, nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update dynamic README sections"
            git push
          fi
